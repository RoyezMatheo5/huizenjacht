<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huizenjacht Jabbeke</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --bg: #f6f4ef; --surface: #ffffff; --surface-2: #efece4; --text: #1d1f1c; --muted: #6b6e66;
  --line: #e2ded3; --accent: #2f6b4f; --accent-soft: #e3efe7; --new: #c2410c; --new-soft: #fdebdd;
  --warn: #9a6700; --warn-soft: #fbf0d4; --drop: #1d6fb8; --drop-soft: #e2eefa; --gone: #8a8f86;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141614; --surface: #1d201d; --surface-2: #262a26; --text: #ecebe6; --muted: #9da298;
    --line: #2f342f; --accent: #6cc39a; --accent-soft: #1f3a2d; --new: #fb923c; --new-soft: #3d2516;
    --warn: #e9b949; --warn-soft: #3a3016; --drop: #6cb2f0; --drop-soft: #18304a; --gone: #6d7269;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #141614; --surface: #1d201d; --surface-2: #262a26; --text: #ecebe6; --muted: #9da298;
  --line: #2f342f; --accent: #6cc39a; --accent-soft: #1f3a2d; --new: #fb923c; --new-soft: #3d2516;
  --warn: #e9b949; --warn-soft: #3a3016; --drop: #6cb2f0; --drop-soft: #18304a; --gone: #6d7269;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }

header { padding: 22px 0 10px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
h1 span { color: var(--accent); }
.status { color: var(--muted); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.dot.ok { background: var(--accent); } .dot.ko { background: var(--new); }
.summary { margin: 14px 0 4px; font-size: 15px; }
.summary b { color: var(--new); }

.controls { position: sticky; top: 0; z-index: 500; background: var(--bg); padding: 10px 0;
  border-bottom: 1px solid var(--line); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row + .row { margin-top: 8px; }
.chip, select, input[type=search], .btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px;
  padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
input[type=search] { border-radius: 8px; min-width: 0; flex: 1 1 180px; cursor: text; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .chip[aria-pressed="true"] { color: #10140f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #10140f; } }
.range { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.range input { accent-color: var(--accent); width: 140px; }
.range b { color: var(--text); min-width: 74px; display: inline-block; }
.tabs { margin-left: auto; display: flex; gap: 4px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; padding: 18px 0 40px; }
.card { background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow);
  display: flex; flex-direction: column; position: relative; border: 2px solid transparent; }
.card.is-new { border-color: var(--new); }
.card.is-gone { opacity: .55; }
.photo { aspect-ratio: 4/3; background: var(--surface-2) center/cover no-repeat; position: relative; display: block; }
.badges { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; right: 50px; }
.badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--surface); color: var(--text); }
.badge.new { background: var(--new); color: #fff; }
.badge.option { background: var(--warn-soft); color: var(--warn); }
.badge.drop { background: var(--drop-soft); color: var(--drop); }
.badge.gone { background: var(--surface-2); color: var(--gone); }
.iconbtn { position: absolute; top: 8px; width: 34px; height: 34px; border-radius: 50%; border: 0;
  background: rgba(255,255,255,.92); cursor: pointer; font-size: 17px; line-height: 34px; color: #333; }
.fav { right: 8px; } .hide { right: 8px; top: 48px; font-size: 14px; }
.fav[aria-pressed="true"] { color: #d6336c; }
.body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.price { font-size: 21px; font-weight: 700; letter-spacing: -.01em; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.price s { font-size: 14px; color: var(--muted); font-weight: 400; }
.addr { color: var(--muted); font-size: 14px; }
.addr strong { color: var(--text); font-weight: 600; }
.facts { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.facts span { white-space: nowrap; }
.facts .epc { font-weight: 700; font-size: 11px; padding: 2px 7px 2px 6px; border-radius: 3px 10px 10px 3px; letter-spacing: .02em; }
.flags { display: flex; gap: 6px; flex-wrap: wrap; }
.flag { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); }
.flag.neutral { background: var(--surface-2); color: var(--muted); }
.foot { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); display: flex;
  justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.links { display: flex; gap: 6px; flex-wrap: wrap; }
.links a { text-decoration: none; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.links a.gone { background: var(--surface-2); color: var(--gone); text-decoration: line-through; }
.agency { font-size: 12px; color: var(--muted); }
.empty { padding: 60px 0; text-align: center; color: var(--muted); }
#map { height: calc(100vh - 210px); min-height: 420px; border-radius: 14px; margin: 18px 0 40px; display: none; }
.leaflet-popup-content { margin: 10px 12px; font: 13px/1.4 system-ui, sans-serif; }
.leaflet-popup-content img { width: 100%; border-radius: 6px; margin-bottom: 6px; }
footer { color: var(--muted); font-size: 12px; padding: 0 0 30px; }
@media (max-width: 600px) { h1 { font-size: 22px; } .tabs { margin-left: 0; } .range input { width: 110px; } }
</style>
</head>
<body>
<header class="wrap">
  <div class="top">
    <h1>Huizenjacht <span>Jabbeke</span></h1>
    <div class="status" id="status"></div>
  </div>
  <div class="summary" id="summary">Laden...</div>
</header>

<div class="controls">
  <div class="wrap">
    <div class="row">
      <input type="search" id="q" placeholder="Zoek straat, gemeente of kantoor" aria-label="Zoeken">
      <select id="sort" aria-label="Sorteren">
        <option value="new">Nieuwste eerst</option>
        <option value="price">Goedkoopste eerst</option>
        <option value="pricedesc">Duurste eerst</option>
        <option value="m2">Laagste prijs per m²</option>
        <option value="plot">Grootste perceel</option>
      </select>
      <div class="tabs">
        <button class="chip" id="tabList" aria-pressed="true">Lijst</button>
        <button class="chip" id="tabMap" aria-pressed="false">Kaart</button>
      </div>
    </div>
    <div class="row" id="towns"></div>
    <div class="row">
      <label class="range">Max <b id="maxOut"></b><input type="range" id="max" min="100000" max="350000" step="5000"></label>
      <select id="beds" aria-label="Slaapkamers">
        <option value="0">Alle slaapkamers</option><option value="2">2+ slpk</option>
        <option value="3">3+ slpk</option><option value="4">4+ slpk</option>
      </select>
      <button class="chip" id="onlyFav" aria-pressed="false">Favorieten</button>
      <button class="chip" id="onlyNew" aria-pressed="false">Alleen nieuw</button>
      <button class="chip" id="showOption" aria-pressed="false">Toon in optie</button>
      <button class="chip" id="showGone" aria-pressed="false">Toon verdwenen</button>
      <button class="chip" id="showHidden" aria-pressed="false">Toon verborgen</button>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <div id="map"></div>
</main>
<footer class="wrap" id="footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('hj.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('hj.' + k, JSON.stringify(v)); } catch {} },
  };
  const euro = (n) => n == null ? 'Prijs op aanvraag' : '€ ' + n.toLocaleString('nl-BE');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const SRC = { immoweb: 'Immoweb', zimmo: 'Zimmo', immovlan: 'Immovlan', kantoren: 'Kantoorsites', residentie: 'Residentie Vastgoed' };
  const linkLabel = (a) => a.source === 'kantoren' || a.source === 'residentie' ? (a.agency || SRC[a.source]) : (SRC[a.source] || a.source);
  const DAY = 864e5;

  function ago(iso) {
    const d = (Date.now() - Date.parse(iso)) / 1000;
    if (d < 3600) return Math.max(1, Math.round(d / 60)) + ' min geleden';
    if (d < 86400) return Math.round(d / 3600) + ' u geleden';
    const days = Math.round(d / 86400);
    return days === 1 ? 'gisteren' : days + ' dagen geleden';
  }

  // "Nieuw" = verschenen sinds je vorige bezoek (min. de laatste 24 u), nooit de startlijst.
  const prevVisit = store.get('lastVisit', null);
  const newSince = Math.min(prevVisit ? Date.parse(prevVisit) : Date.now(), Date.now() - DAY);
  addEventListener('pagehide', () => store.set('lastVisit', new Date().toISOString()));
  setTimeout(() => store.set('lastVisit', new Date().toISOString()), 60000);

  let favs = new Set(store.get('favs', []));
  let hidden = new Set(store.get('hidden', []));
  const state = Object.assign({ q: '', sort: 'new', towns: [], max: 350000, beds: 0, onlyFav: false,
    onlyNew: false, showOption: false, showGone: false, showHidden: false, view: 'list' }, store.get('filters', {}));
  state.q = '';

  let all = [], map, layer;

  fetch('data/listings.json?t=' + Date.now()).then((r) => r.json()).then((db) => {
    all = db.listings.map((g) => ({
      ...g,
      isNew: !g.seed && Date.parse(g.firstSeen) > newSince,
      oldPrice: g.priceHistory.length > 1 ? Math.max(...g.priceHistory.map((p) => p.price)) : null,
      ppm: g.price && g.livingArea ? g.price / g.livingArea : null,
      ads: Object.values(g.ads),
    }));
    renderStatus(db.meta);
    renderTowns();
    bind();
    render();
  }).catch(() => { $('summary').textContent = 'Kon de gegevens niet laden.'; });

  function renderStatus(meta) {
    const s = Object.entries(meta.sources || {}).map(([k, v]) =>
      `<span title="${esc(v.error || v.count + ' advertenties')}"><i class="dot ${v.ok ? 'ok' : 'ko'}"></i>${SRC[k] || k}</span>`).join('');
    $('status').innerHTML = `${s}<span>Laatst gecontroleerd ${meta.lastRun ? ago(meta.lastRun) : 'nog nooit'}</span>`;
    const c = meta.criteria || {};
    $('footer').innerHTML = `Criteria: huis, max ${euro(c.maxPrice)}, min ${c.minBedrooms} slaapkamers, in ${esc((c.areas || []).join(', '))}` +
      (c.excluded?.length ? `, zonder ${esc(c.excluded.join(', '))}` : '') + '. Favorieten en verborgen huizen worden alleen in deze browser bewaard.';
  }

  function renderTowns() {
    const counts = {};
    all.filter((g) => !g.removedAt).forEach((g) => { const t = g.locality || 'Onbekend'; counts[t] = (counts[t] || 0) + 1; });
    const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    $('towns').innerHTML = names.map((n) =>
      `<button class="chip" data-town="${esc(n)}" aria-pressed="${state.towns.includes(n)}">${esc(n)} ${counts[n]}</button>`).join('');
    $('towns').onclick = (e) => {
      const b = e.target.closest('[data-town]'); if (!b) return;
      const t = b.dataset.town;
      state.towns = state.towns.includes(t) ? state.towns.filter((x) => x !== t) : [...state.towns, t];
      b.setAttribute('aria-pressed', state.towns.includes(t)); save(); render();
    };
  }

  function bind() {
    $('q').oninput = (e) => { state.q = e.target.value.toLowerCase(); render(); };
    $('sort').value = state.sort; $('sort').onchange = (e) => { state.sort = e.target.value; save(); render(); };
    $('max').value = state.max; $('maxOut').textContent = euro(+state.max);
    $('max').oninput = (e) => { state.max = +e.target.value; $('maxOut').textContent = euro(state.max); save(); render(); };
    $('beds').value = state.beds; $('beds').onchange = (e) => { state.beds = +e.target.value; save(); render(); };
    for (const k of ['onlyFav', 'onlyNew', 'showOption', 'showGone', 'showHidden']) {
      $(k).setAttribute('aria-pressed', state[k]);
      $(k).onclick = () => { state[k] = !state[k]; $(k).setAttribute('aria-pressed', state[k]); save(); render(); };
    }
    $('tabList').onclick = () => setView('list');
    $('tabMap').onclick = () => setView('map');
    setView(state.view);
    $('grid').onclick = (e) => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      e.preventDefault();
      const id = b.dataset.id, set = b.dataset.act === 'fav' ? favs : hidden;
      set.has(id) ? set.delete(id) : set.add(id);
      store.set('favs', [...favs]); store.set('hidden', [...hidden]); render();
    };
  }

  function save() { const { q, ...rest } = state; store.set('filters', rest); }

  function filtered() {
    let list = all.filter((g) => {
      if (g.removedAt && !state.showGone) return false;
      if (g.status && !state.showOption) return false;
      if (hidden.has(g.id) && !state.showHidden) return false;
      if (state.onlyFav && !favs.has(g.id)) return false;
      if (state.onlyNew && !g.isNew) return false;
      if (state.towns.length && !state.towns.includes(g.locality || 'Onbekend')) return false;
      if (g.price != null && g.price > state.max) return false;
      if (state.beds && g.bedrooms != null && g.bedrooms < state.beds) return false;
      if (state.q) {
        const hay = [g.street, g.locality, g.postcode, ...(g.agencies || []), ...(g.flags || [])].join(' ').toLowerCase();
        if (!hay.includes(state.q)) return false;
      }
      return true;
    });
    const by = {
      new: (a, b) => b.firstSeen.localeCompare(a.firstSeen),
      price: (a, b) => (a.price ?? 9e9) - (b.price ?? 9e9),
      pricedesc: (a, b) => (b.price ?? 0) - (a.price ?? 0),
      m2: (a, b) => (a.ppm ?? 9e9) - (b.ppm ?? 9e9),
      plot: (a, b) => (b.plotArea ?? 0) - (a.plotArea ?? 0),
    }[state.sort];
    list.sort((a, b) => (b.isNew - a.isNew) || by(a, b));
    return list;
  }

  // EPC-schaal Vlaanderen: A+ en A donkergroen tot F rood.
  const EPC = { 'A+': ['#00843d', '#fff'], A: ['#1a9f48', '#fff'], B: ['#8cc63f', '#1d1f1c'],
    C: ['#ffd500', '#1d1f1c'], D: ['#f7a823', '#1d1f1c'], E: ['#ec6b1c', '#fff'], F: ['#d7261e', '#fff'] };
  function epcBadge(raw) {
    const k = String(raw).toUpperCase().replace(/\s/g, '').replace('PLUS', '+');
    const [bg, fg] = EPC[k] || EPC[k.replace(/\++$/, '')] || ['var(--surface-2)', 'var(--text)'];
    return `<span class="epc" style="background:${bg};color:${fg}" title="EPC-label ${esc(k)}">EPC ${esc(k)}</span>`;
  }

  function card(g) {
    const badges = [];
    if (g.isNew) badges.push('<span class="badge new">NIEUW</span>');
    if (g.removedAt) badges.push('<span class="badge gone">Niet meer online</span>');
    else if (g.status === 'sold') badges.push('<span class="badge option">Verkocht</span>');
    else if (g.status === 'option') badges.push('<span class="badge option">In optie</span>');
    if (g.oldPrice && g.oldPrice > g.price) badges.push('<span class="badge drop">Prijs gedaald</span>');
    const facts = [
      g.bedrooms != null && `<span>🛏 ${g.bedrooms} slpk</span>`,
      g.livingArea && `<span>🏠 ${g.livingArea} m²</span>`,
      g.plotArea && `<span>🌳 ${g.plotArea} m²</span>`,
      g.epc && epcBadge(g.epc),
      g.ppm && `<span>€ ${Math.round(g.ppm).toLocaleString('nl-BE')}/m²</span>`,
    ].filter(Boolean).join('');
    const flags = (g.flags || []).map((f) => `<span class="flag ${f === 'Renovatie' || f === 'Nieuwbouw' ? 'neutral' : ''}">${esc(f)}</span>`).join('');
    const seen = new Set();
    const links = g.ads.filter((a) => { const k = linkLabel(a) + (a.gone ? 'x' : ''); if (seen.has(k)) return false; seen.add(k); return true; })
      .map((a) => `<a href="${esc(a.url)}" target="_blank" rel="noopener" class="${a.gone ? 'gone' : ''}">${esc(linkLabel(a))}</a>`).join('');
    const onlyAgency = g.ads.every((a) => a.source === 'kantoren' || a.source === 'residentie');
    if (onlyAgency && !g.removedAt) badges.push('<span class="badge drop">Niet op portalen</span>');
    const main = g.ads.find((a) => !a.gone) || g.ads[0];
    const addr = [g.street && esc(g.street + ' ' + (g.number || '')), `<strong>${esc(g.locality || '')}</strong>`].filter(Boolean).join(', ');
    return `<article class="card ${g.isNew ? 'is-new' : ''} ${g.removedAt ? 'is-gone' : ''}">
      <a class="photo" href="${esc(main.url)}" target="_blank" rel="noopener" style="background-image:url('${esc(g.photo || '')}')">
        <div class="badges">${badges.join('')}</div>
      </a>
      <button class="iconbtn fav" data-act="fav" data-id="${esc(g.id)}" aria-pressed="${favs.has(g.id)}" title="Favoriet">${favs.has(g.id) ? '♥' : '♡'}</button>
      <button class="iconbtn hide" data-act="hide" data-id="${esc(g.id)}" title="${hidden.has(g.id) ? 'Terug tonen' : 'Verbergen'}">${hidden.has(g.id) ? '↺' : '✕'}</button>
      <div class="body">
        <div class="price">${euro(g.price)}${g.oldPrice && g.oldPrice > g.price ? `<s>${euro(g.oldPrice)}</s>` : ''}</div>
        <div class="addr">${addr} · ${esc(g.postcode || '')}</div>
        <div class="facts">${facts}</div>
        ${flags ? `<div class="flags">${flags}</div>` : ''}
        ${g.agencies?.length ? `<div class="agency">${esc(g.agencies.join(' · '))}</div>` : ''}
        <div class="foot"><div class="links">${links}</div><span>${g.seed ? 'Al online bij start' : 'Gevonden ' + ago(g.firstSeen)}</span></div>
      </div>
    </article>`;
  }

  function render() {
    const list = filtered();
    const active = all.filter((g) => !g.removedAt);
    const nNew = active.filter((g) => g.isNew).length;
    $('summary').innerHTML = `${active.length} huizen te koop` +
      (nNew ? `, waarvan <b>${nNew} nieuw</b> sinds je vorige bezoek` : ', niets nieuws sinds je vorige bezoek') +
      `. ${list.length} getoond.`;
    $('grid').innerHTML = list.length ? list.map(card).join('') : '<div class="empty">Geen huizen met deze filters.</div>';
    if (state.view === 'map') renderMap(list);
  }

  function setView(v) {
    state.view = v; save();
    $('tabList').setAttribute('aria-pressed', v === 'list');
    $('tabMap').setAttribute('aria-pressed', v === 'map');
    $('grid').style.display = v === 'list' ? '' : 'none';
    $('map').style.display = v === 'map' ? 'block' : 'none';
    if (v === 'map' && all.length) renderMap(filtered());
  }

  function renderMap(list) {
    if (!window.L) { $('map').textContent = 'Kaart kon niet laden.'; return; }
    if (!map) {
      map = L.map('map').setView([51.18, 3.09], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
      layer = L.layerGroup().addTo(map);
    }
    setTimeout(() => map.invalidateSize(), 50);
    layer.clearLayers();
    const pts = list.filter((g) => g.lat && g.lon);
    for (const g of pts) {
      const color = g.isNew ? '#c2410c' : favs.has(g.id) ? '#d6336c' : '#2f6b4f';
      const main = g.ads.find((a) => !a.gone) || g.ads[0];
      L.circleMarker([g.lat, g.lon], { radius: 8, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1 })
        .bindPopup(`${g.photo ? `<img src="${esc(g.photo)}" alt="">` : ''}<b>${euro(g.price)}</b><br>${esc(g.street || '')} ${esc(g.number || '')}, ${esc(g.locality || '')}<br>${g.bedrooms ?? '?'} slpk · ${g.livingArea ?? '?'} m²<br><a href="${esc(main.url)}" target="_blank" rel="noopener">Bekijk advertentie</a>`)
        .addTo(layer);
    }
    const missing = list.length - pts.length;
    $('summary').insertAdjacentHTML('beforeend', missing ? ` <span style="color:var(--muted)">(${missing} zonder coördinaten staan niet op de kaart)</span>` : '');
  }
})();
</script>
</body>
</html>
